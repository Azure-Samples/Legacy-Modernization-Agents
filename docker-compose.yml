services:
  portal:
    build: .
    container_name: ${PORTAL_CONTAINER:-cobol-migration-portal}
    restart: unless-stopped
    ports:
      - "${MCP_WEB_PORT:-5028}:5028"
    env_file:
      - ./Config/ai-config.local.env
    volumes:
      - ./Data:/app/Data
      - ./Logs:/app/Logs
      - ./Config:/app/Config
    environment:
      - MIGRATION_DB_PATH=/app/Data/migration.db
      - Mcp__DotnetExecutable=dotnet
      - Mcp__AssemblyPath=/app/cli/CobolToQuarkusMigration.dll
      - Mcp__ConfigPath=/app/Config/appsettings.json
      - Mcp__WorkingDirectory=/app
      - ApplicationSettings__Neo4j__Uri=bolt://neo4j:7687
      - ApplicationSettings__Neo4j__Username=neo4j
      - ApplicationSettings__Neo4j__Password=${NEO4J_PASSWORD:?Run ./doctor.sh setup and set NEO4J_PASSWORD in Config/ai-config.local.env}
    depends_on:
      - neo4j

  # One graph for everything: the migration dependency graph the CLI writes and the REKT
  # AST/CFG/data graph the populator writes share a schema (nodes keyed by run-scoped uid).
  # Names and host ports can be overridden (see Config/ai-config.env.example) to run two
  # checkouts side by side.
  neo4j:
    image: neo4j:5.15.0
    container_name: ${NEO4J_CONTAINER:-cobol-migration-neo4j}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"  # HTTP
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt
    environment:
      # Neo4j fixes the password in its data volume on first start and ignores NEO4J_AUTH
      # afterwards; ./doctor.sh reports a mismatch.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Run ./doctor.sh setup and set NEO4J_PASSWORD in Config/ai-config.local.env}
      - HEALTHCHECK_PASSWORD=${NEO4J_PASSWORD:?Run ./doctor.sh setup and set NEO4J_PASSWORD in Config/ai-config.local.env}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_server_bolt_advertised__address=localhost:${NEO4J_BOLT_PORT:-7687}
      - NEO4J_server_http_advertised__address=localhost:${NEO4J_HTTP_PORT:-7474}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-512m}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:-2G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512m}
    volumes:
      # New volume names: the two earlier instances (neo4j_data, rekt_neo4j_data) held
      # incompatible copies of the same nodes. Their volumes are left in place.
      - graph_data:/data
      - graph_logs:/logs
      - graph_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Cobol-REKT Java CLI — parses COBOL into AST/CFG/Data JSON exports.
  # Stays alive as a sidecar; the Python populator calls it via docker exec.
  # Image: rekt-oss-mma — our patched, MIT-licensed re-distribution of
  # smojol's COBOL toolkit (https://github.com/avishek-sen-gupta/cobol-rekt).
  # See tools/cobol-rekt/LICENSE and tools/cobol-rekt/NOTICE for attribution.
  cobol-rekt:
    image: rekt-oss-mma:latest
    build:
      context: ./tools/cobol-rekt
      dockerfile: Dockerfile
    container_name: ${REKT_CONTAINER:-cobol-rekt}
    restart: unless-stopped
    volumes:
      - ./source:/source:ro
      - ./output/rekt:/output
    entrypoint: ["tail", "-f", "/dev/null"]

  # Python graph populator — ingests rekt JSON + MMA metadata into Neo4j.
  graph-populator:
    build:
      context: ./tools/graph-populator
      dockerfile: Dockerfile
    container_name: ${REKT_POPULATOR_CONTAINER:-cobol-graph-populator}
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Run ./doctor.sh setup and set NEO4J_PASSWORD in Config/ai-config.local.env}
      - REKT_CONTAINER=${REKT_CONTAINER:-cobol-rekt}
      - REKT_OUTPUT_DIR=/output
      - SOURCE_DIR=/source
    volumes:
      - ./source:/source:ro
      - ./output/rekt:/output
      - ./Data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  graph_data:
  graph_logs:
  graph_import:
