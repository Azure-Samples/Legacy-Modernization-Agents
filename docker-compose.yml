# Pin the Compose project name.
#
# Compose otherwise derives it from the directory name, while every service here
# also fixes `container_name:`. Two checkouts, a renamed folder or a re-clone
# under a different name therefore produce a different project that collides on
# the fixed container names:
#   Conflict. The container name "/cobol-rekt" is already in use
# Pinning the name keeps one stable project regardless of the folder. doctor.sh
# also exports COMPOSE_PROJECT_NAME so Compose versions that predate this key
# behave identically.
name: legacy-modernization-agents

services:
  portal:
    build: .
    container_name: cobol-migration-portal
    # Opt-in only. doctor.sh runs the portal directly on the host on port 5028;
    # without a profile a bare `docker compose up -d` would also start this
    # container on the same port, and because of `restart: unless-stopped` it
    # would reclaim 5028 after every Docker restart, making the host portal fail
    # with AddressInUseException. Start it explicitly instead:
    #   docker compose --profile container-portal up -d portal
    profiles: ["container-portal"]
    restart: unless-stopped
    ports:
      - "5028:5028"
    env_file:
      - path: ./Config/ai-config.env
        required: true
      # Personal overrides; gitignored, so absent on a fresh clone. Compose
      # treats env_file as mandatory by default, which made every whole-project
      # command fail before any container started. (Needs Compose v2.24+;
      # doctor.sh also creates the file so older versions keep working.)
      - path: ./Config/ai-config.local.env
        required: false
    volumes:
      - ./Data:/app/Data
      - ./Logs:/app/Logs
      - ./Config:/app/Config
    environment:
      - MIGRATION_DB_PATH=/app/Data/migration.db
      - Mcp__DotnetExecutable=dotnet
      - Mcp__AssemblyPath=/app/cli/CobolToQuarkusMigration.dll
      - Mcp__ConfigPath=/app/Config/appsettings.json
      - Mcp__WorkingDirectory=/app
      - ApplicationSettings__Neo4j__Uri=bolt://neo4j:7687
      # The rekt graph lives in a second Neo4j. The portal defaults to
      # bolt://localhost:7688, which inside this container resolves to the
      # container itself — so the REKT panels must be pointed at the service
      # name and its in-network bolt port.
      - REKT_NEO4J_URI=bolt://cobol-rekt-neo4j:7687
      - REKT_NEO4J_USER=neo4j
      - REKT_NEO4J_PASSWORD=cobol-rekt-2026
    depends_on:
      - neo4j
      - cobol-rekt-neo4j

  neo4j:
    image: neo4j:5.15.0
    container_name: cobol-migration-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/cobol-migration-2025
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p cobol-migration-2025 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Cobol-REKT Integration ─────────────────────────────────────────
  # Separate Neo4j instance for rekt's unified graph (AST/CFG/Data).
  # Runs on different ports so existing experiments are not affected.
  cobol-rekt-neo4j:
    image: neo4j:5.15.0
    container_name: cobol-rekt-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474"  # HTTP (rekt)
      - "7688:7687"  # Bolt (rekt)
    environment:
      - NEO4J_AUTH=neo4j/cobol-rekt-2026
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - rekt_neo4j_data:/data
      - rekt_neo4j_logs:/logs
      - rekt_neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p cobol-rekt-2026 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Cobol-REKT Java CLI — parses COBOL into AST/CFG/Data JSON exports.
  # Stays alive as a sidecar; the Python populator calls it via docker exec.
  # Image: rekt-oss-mma — our patched, MIT-licensed re-distribution of
  # smojol's COBOL toolkit (https://github.com/avishek-sen-gupta/cobol-rekt).
  # See tools/cobol-rekt/LICENSE and tools/cobol-rekt/NOTICE for attribution.
  cobol-rekt:
    image: rekt-oss-mma:latest
    build:
      context: ./tools/cobol-rekt
      dockerfile: Dockerfile
    container_name: cobol-rekt
    restart: unless-stopped
    volumes:
      - ./source:/source:ro
      - ./output/rekt:/output
    entrypoint: ["tail", "-f", "/dev/null"]

  # Python graph populator — ingests rekt JSON + MMA metadata into Neo4j.
  graph-populator:
    build:
      context: ./tools/graph-populator
      dockerfile: Dockerfile
    container_name: cobol-graph-populator
    environment:
      - NEO4J_URI=bolt://cobol-rekt-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cobol-rekt-2026
      - REKT_CONTAINER=cobol-rekt
      - REKT_OUTPUT_DIR=/output
      - SOURCE_DIR=/source
    volumes:
      - ./source:/source:ro
      - ./output/rekt:/output
      - ./Data:/data
    depends_on:
      cobol-rekt-neo4j:
        condition: service_healthy
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  rekt_neo4j_data:
  rekt_neo4j_logs:
  rekt_neo4j_import:
