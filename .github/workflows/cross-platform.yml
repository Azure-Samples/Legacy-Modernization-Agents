name: Cross-platform checks

on:
  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.cs"
      - "**/*.csproj"
      - "tools/**"
      - ".gitattributes"
      - ".github/workflows/cross-platform.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-and-portal:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, the shell doctor.sh supports there.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Shell scripts parse and use LF line endings
        run: |
          status=0
          while IFS= read -r -d '' script; do
            bash -n "$script" || status=1
            if grep -q $'\r' "$script"; then
              echo "CRLF line endings: $script"
              status=1
            fi
          done < <(git ls-files -z '*.sh')
          exit $status

      - name: doctor.sh platform helpers
        run: tools/tests/doctor-helpers-smoke.sh

      - name: JCL discovery and isolated CLI ingestion
        run: >-
          dotnet test CobolToQuarkusMigration.Tests -p:CopilotSkipCliDownload=true --nologo
          --filter "FullyQualifiedName~CobolToQuarkusMigration.Tests.Doctor.DoctorJclScanTests|FullyQualifiedName~CobolToQuarkusMigration.Tests.Doctor.DoctorJclCliIngestTests"

      - name: REKT preprocessing and dependency export scripts
        run: >-
          dotnet test CobolToQuarkusMigration.Tests -p:CopilotSkipCliDownload=true --nologo
          --filter "FullyQualifiedName~CobolToQuarkusMigration.Tests.Rekt.PreprocessForRektScriptTests|FullyQualifiedName~CobolToQuarkusMigration.Tests.Doctor.DoctorRektDependencyExportTests"

      - name: Portal process control
        run: >-
          dotnet test McpChatWeb.Tests --nologo --blame-hang-timeout 120s
          --filter "FullyQualifiedName~ProcessTreeSuspender|FullyQualifiedName~McpProcessClientCancellationTests"
